backend:
  name: github
  repo: oranjekip/oranjekip.github.io
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "site_data"
    label: "Website İçerikleri"
    files:
      - label: "Ürünler ve Fiyatlar"
        name: "products"
        file: "data/products.json"
        json_node_mode: "raw"
        fields:
          - label: "Ürün Listesi"
            name: ""
            widget: "list"
            summary: "{{fields.name}} - {{fields.price}}"
            fields:
              - { label: "Ürün Adı", name: "name", widget: "string" }
              - { label: "Fiyat", name: "price", widget: "string" }
              - { label: "Resim", name: "image", widget: "image" }
              - { label: "Aktif mi?", name: "active", widget: "boolean", default: true }

      - label: "Lokasyonlar (Waar we zijn)"
        name: "locations"
        file: "data/locations.json"
        json_node_mode: "raw"
        fields:
          - label: "Lokasyon Listesi"
            name: ""
            widget: "list"
            summary: "{{fields.name}} ({{fields.day}})"
            fields:
              - { label: "Konum / Şehir", name: "name", widget: "string" }
              - { label: "Gün", name: "day", widget: "string" }
              - { label: "Çalışma Saatleri", name: "hours", widget: "string" }
              - { label: "Google Maps Linki", name: "map", widget: "string", required: false }
              - { label: "Aktif mi?", name: "active", widget: "boolean", default: true }

      - label: "Müşteri Yorumları"
        name: "testimonials"
        file: "data/testimonials.json"
        json_node_mode: "raw"
        fields:
          - label: "Yorum Listesi"
            name: ""
            widget: "list"
            summary: "{{fields.author}}"
            fields:
              - { label: "Yorum Metni", name: "text", widget: "text" }
              - { label: "Yazar / Şehir", name: "author", widget: "string" }
              - { label: "Aktif mi?", name: "active", widget: "boolean", default: true }

      - label: "Genel Site Ayarları"
        name: "site"
        file: "data/site.json"
        fields:
          - { label: "Hero Başlık", name: "heroTitle", widget: "string" }
          - { label: "Hero Alt Başlık", name: "tagline", widget: "string" }
          - { label: "Hero Resmi", name: "heroImage", widget: "image" }
          - { label: "Menü Görseli", name: "menuImage", widget: "image" }
          - { label: "Menü PDF", name: "menuPdf", widget: "file" }
          - { label: "Hakkımızda Başlık", name: "aboutTitle", widget: "string" }
          - { label: "Hakkımızda Metin", name: "aboutText", widget: "text" }
          - { label: "Instagram", name: "instagram", widget: "string" }
          - { label: "Facebook", name: "facebook", widget: "string" }
          - { label: "E-Posta", name: "email", widget: "string" }
          - { label: "Duyuru Bannerı Açık mı?", name: "previewBanner", widget: "boolean", default: false }
          - { label: "Duyuru Başlığı", name: "previewTitle", widget: "string", required: false }
          - { label: "Duyuru Metni", name: "previewText", widget: "string", required: false }
          - { label: "Sipariş Uyarısı Metni", name: "previewOrders", widget: "string", required: false }